services:
  bentoml:
    build: .
    environment:
      PORT: "3000"
      BENTOML_DO_NOT_TRACK: "True"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
